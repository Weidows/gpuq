<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gpuq — GPU 任务看板</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎛️</text></svg>">
</head>
<body>
<header class="topbar">
  <div class="brand">🎛️ gpuq <span class="tag">GPU 任务看板</span></div>
  <div class="topbar-right">
    <span id="host-badge" class="badge" title="server">connecting…</span>
    <span id="host-metrics-badge" class="badge badge-muted" title="host net/disk/cpu metrics (needs psutil)">host metrics: …</span>
    <span id="clock" class="muted"></span>
  </div>
</header>

<div id="paused-banner" class="banner banner-error hidden">
  <b>⏸ 队列已暂停</b>
  <span id="pause-reason"></span>
  <button id="btn-resume" class="btn btn-sm">恢复队列</button>
</div>
<div id="error-banner" class="banner banner-warn hidden"></div>

<main>
  <section class="panel">
    <div class="panel-head">
      <h2>📋 任务</h2>
      <div class="head-actions">
        <span id="counts" class="muted" style="font-size:12px"></span>
        <button id="btn-refresh" class="btn btn-sm">↻ 刷新</button>
        <button id="btn-new" class="btn btn-sm btn-primary">+ 新建任务</button>
      </div>
    </div>
    <div class="tabs" id="status-tabs">
      <button data-status="" class="tab active">全部</button>
      <button data-status="queued" class="tab">排队</button>
      <button data-status="running" class="tab">运行中</button>
      <button data-status="succeeded" class="tab">成功</button>
      <button data-status="failed" class="tab">失败</button>
      <button data-status="cancelled" class="tab">已取消</button>
    </div>
  </section>

  <section id="board" class="board">
    <div id="rail" class="rail hidden"></div>
    <div id="cards" class="cards"></div>
    <aside id="detail" class="detail hidden">
      <div class="detail-head">
        <h3 id="detail-title">任务详情</h3>
        <button id="btn-detail-close" class="btn btn-sm">✕ 返回</button>
      </div>
      <div id="detail-body"></div>
    </aside>
  </section>
</main>

<!-- new task modal -->
<div id="modal-new" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h3>提交任务</h3>
      <button class="btn btn-sm modal-close" data-close="modal-new">✕</button>
    </div>
    <form id="form-new">
      <div class="grid2">
        <label>项目名 <input name="project" placeholder="demo" required></label>
        <label>用户名 <input name="username" placeholder="you"></label>
        <label>GPU ID <input name="gpu_id" placeholder="留空=自动分配"></label>
        <label>预估显存 (MiB) <input name="vram_mb" type="number" min="0" placeholder="0"></label>
        <label>预估时长 (s) <input name="est_seconds" type="number" min="0" placeholder="0"></label>
        <label>优先级 <input name="priority" type="number" value="5"></label>
        <label>fallback_wait (s) <input name="fallback_wait_seconds" type="number" min="0" value="0"
          title="启动缓冲窗口：任务在该秒数内退出则自动暂停整个队列，方便调试"></label>
        <label>功耗上限 (W, 可选) <input name="power_limit_w" type="number" min="0" placeholder="留空不限制"></label>
        <label class="span2">版本 <input name="version" placeholder="commit hash / tag（用于追溯）"></label>
        <label class="span2">工作目录 <input name="cwd" placeholder="留空 = 服务端当前目录"></label>
        <label class="span2">环境变量 (JSON) <input name="env" placeholder='{"CUDA_VISIBLE_DEVICES":"0"}'></label>
      </div>
      <label>命令（程序 + 参数）</label>
      <textarea name="command" rows="2" placeholder="python main.py --epochs 10" required></textarea>
      <div class="modal-foot">
        <button type="button" class="btn modal-close" data-close="modal-new">取消</button>
        <button type="submit" class="btn btn-primary">提交</button>
      </div>
    </form>
  </div>
</div>

<script src="vendor/chart.umd.min.js" onerror="document.write('<script src=&quot;https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js&quot;><\/script>')"></script>
<script src="app.js"></script>
</body>
</html>
